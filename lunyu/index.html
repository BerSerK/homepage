<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="随机展示论语中的一章原文、注释与译文，并附所属篇名与本篇引语。">
  <title>论语随机一章</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-start: #f4efe6;
      --bg-end: #dbeafe;
      --card-bg: rgba(255, 255, 255, 0.88);
      --text: #1f2937;
      --accent: #9a3412;
      --accent-hover: #7c2d12;
      --accent-soft: rgba(154, 52, 18, 0.12);
      --muted: #5b6475;
      --line: rgba(31, 41, 55, 0.08);
      --shadow: 0 18px 40px rgba(28, 51, 84, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: radial-gradient(circle at 18% 18%, rgba(154, 52, 18, 0.12), transparent 34%),
                  radial-gradient(circle at 84% 10%, rgba(59, 130, 246, 0.14), transparent 30%),
                  linear-gradient(160deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    }

    .page {
      width: min(1080px, 100%);
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    .title {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: 0.6px;
      font-family: 'Space Grotesk', 'Noto Serif SC', serif;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: clamp(20px, 4vw, 34px);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      position: relative;
      overflow: hidden;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      letter-spacing: 0.3px;
      font-family: 'Space Grotesk', 'Noto Serif SC', serif;
    }

    .chapter-title {
      margin: 14px 0 6px;
      font-size: clamp(20px, 2.8vw, 28px);
      color: #111827;
      animation: fade-in 300ms ease;
    }

    .chapter-id {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      font-family: 'Space Grotesk', 'Noto Serif SC', serif;
      letter-spacing: 0.4px;
    }

    .intro-box {
      margin: 0 0 18px;
      padding: 16px 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(154, 52, 18, 0.08), rgba(59, 130, 246, 0.08));
      border: 1px solid rgba(154, 52, 18, 0.08);
      animation: fade-in 320ms ease;
    }

    .section-label {
      margin: 0 0 8px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.4px;
    }

    .content {
      margin: 0;
      white-space: pre-line;
      line-height: 1.9;
      font-size: clamp(16px, 2.2vw, 20px);
      animation: fade-in 320ms ease;
    }

    .content + .section-label {
      margin-top: 18px;
    }

    .notes,
    .translation,
    .intro-text {
      font-size: clamp(15px, 1.95vw, 18px);
      color: #314158;
    }

    .meta {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 14px;
    }

    button {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Space Grotesk', 'Noto Serif SC', serif;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, background 160ms ease;
      box-shadow: 0 10px 24px rgba(154, 52, 18, 0.24);
    }

    button:hover { transform: translateY(-1px); background: var(--accent-hover); }
    button:active { transform: translateY(0); box-shadow: 0 4px 12px rgba(154, 52, 18, 0.28); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

    footer {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 14px;
      }

      .card {
        padding: 20px 16px 22px;
      }
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1 class="title">论语 · 随机一章</h1>
      <p class="subtitle">每次刷新随机展示一章，并同时给出本篇引语、原文、注释与译文。</p>
    </header>

    <main class="card" aria-live="polite">
      <span class="badge" id="badge">加载中...</span>
      <h2 class="chapter-title" id="chapterTitle">正在解析章节...</h2>
      <p class="chapter-id" id="chapterId"></p>

      <section class="intro-box" id="introBox">
        <p class="section-label">本篇引语</p>
        <p class="content intro-text" id="introText"></p>
      </section>

      <p class="section-label">原文</p>
      <p class="content" id="originText">正在抓取内容...</p>

      <p class="section-label">注释</p>
      <p class="content notes" id="notesText"></p>

      <p class="section-label">译文</p>
      <p class="content translation" id="translationText"></p>

      <div class="meta">
        <span id="count">共 0 章</span>
        <button id="refresh" type="button">换一章</button>
      </div>
    </main>

    <footer>数据源：上一级目录中的“论语.txt”，按每篇引语与各章的原文、注释、译文结构解析</footer>
  </div>

  <script>
    (function() {
      const chapterTitleEl = document.getElementById('chapterTitle');
      const chapterIdEl = document.getElementById('chapterId');
      const introBoxEl = document.getElementById('introBox');
      const introTextEl = document.getElementById('introText');
      const originTextEl = document.getElementById('originText');
      const notesTextEl = document.getElementById('notesText');
      const translationTextEl = document.getElementById('translationText');
      const countEl = document.getElementById('count');
      const badgeEl = document.getElementById('badge');
      const button = document.getElementById('refresh');

      let chapters = [];

      function normalizeText(text) {
        return text.replace(/\r\n/g, '\n').replace(/^\uFEFF/, '');
      }

      function cleanText(text) {
        return (text || '')
          .replace(/^[ \t\u3000]+/gm, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
      }

      function inferTitleFromIntro(intro) {
        const match = intro.match(/《([^》]+)》/);
        return match ? `${match[1]}篇` : '论语篇章';
      }

      function extractSection(block, startPattern, endPattern) {
        const startMatch = block.match(startPattern);
        if (!startMatch) {
          return '';
        }

        const startIndex = startMatch.index + startMatch[0].length;
        const rest = block.slice(startIndex);

        if (!endPattern) {
          return cleanText(rest);
        }

        const endMatch = rest.match(endPattern);
        const endIndex = endMatch ? endMatch.index : rest.length;
        return cleanText(rest.slice(0, endIndex));
      }

      function parseSection(sectionText) {
        const headingMatch = sectionText.match(/^\s*([^\n【]*篇[^\n【]*)\s*\n\s*【本篇引语】/);
        const intro = extractSection(sectionText, /【本篇引语】\s*/m, /\n\s*【原文】\s*/m);
        const rawTitle = headingMatch ? cleanText(headingMatch[1]) : inferTitleFromIntro(intro);
        const title = rawTitle.replace(/第[一二三四五六七八九十百千〇零]+\s*$/, '').trim();
        const chapterBlocks = sectionText.match(/【原文】[\s\S]*?(?=(?:\n\s*【原文】\s*)|$)/g) || [];

        return chapterBlocks.map(function(block) {
          const origin = extractSection(block, /【原文】\s*/m, /\n\s*【注(?:释|解)】\s*/m);
          const notes = extractSection(block, /【注(?:释|解)】\s*/m, /\n\s*【译文】\s*/m);
          const translation = extractSection(block, /【译文】\s*/m, /\n\s*【评析】\s*/m);
          const chapterMatch = origin.match(/^([0-9]+·[0-9]+)\s*/);

          return {
            title: title,
            intro: intro,
            chapterId: chapterMatch ? chapterMatch[1] : '',
            origin: origin,
            notes: notes,
            translation: translation
          };
        }).filter(function(entry) {
          return entry.origin && entry.notes && entry.translation;
        });
      }

      function parseChapters(rawText) {
        const text = normalizeText(rawText);
        const introMatches = Array.from(text.matchAll(/【本篇引语】\s*/g));
        const parts = introMatches.map(function(match, index) {
          const start = match.index;
          const end = index + 1 < introMatches.length ? introMatches[index + 1].index : text.length;
          const prefix = text.slice(0, start);
          const titleMatch = prefix.match(/(?:^|\n)\s*([^\n【]*篇[^\n【]*)\s*\n\s*$/);
          const titleLine = titleMatch ? `${cleanText(titleMatch[1])}\n` : '';

          return `${titleLine}${text.slice(start, end)}`.trim();
        }).filter(Boolean);

        return parts.flatMap(function(sectionText) {
          return parseSection(sectionText);
        });
      }

      function pickAndRender() {
        if (!chapters.length) {
          throw new Error('未解析到章节');
        }

        const selected = chapters[Math.floor(Math.random() * chapters.length)];
        chapterTitleEl.textContent = selected.title;
        chapterIdEl.textContent = selected.chapterId ? `章次 ${selected.chapterId}` : '章次未标注';
        introTextEl.textContent = selected.intro || '暂无本篇引语。';
        introBoxEl.style.display = selected.intro ? 'block' : 'none';
        originTextEl.textContent = selected.origin;
        notesTextEl.textContent = selected.notes;
        translationTextEl.textContent = selected.translation;
        countEl.textContent = `共 ${chapters.length} 章`;
        badgeEl.textContent = '今日一章';
      }

      async function loadDataAndRender() {
        button.disabled = true;
        badgeEl.textContent = '加载中...';

        try {
          if (!chapters.length) {
            const response = await fetch('../论语.txt?cacheBust=' + Date.now());
            if (!response.ok) {
              throw new Error('获取文件失败');
            }

            const text = await response.text();
            chapters = parseChapters(text);
          }

          pickAndRender();
        } catch (error) {
          console.error(error);
          chapterTitleEl.textContent = '加载失败';
          chapterIdEl.textContent = '';
          introTextEl.textContent = '请检查上一级目录中的“论语.txt”是否可访问。';
          originTextEl.textContent = '未能解析到论语章节内容。';
          notesTextEl.textContent = '';
          translationTextEl.textContent = '';
          countEl.textContent = '—';
          badgeEl.textContent = '出错了';
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener('click', pickAndRender);
      loadDataAndRender().catch(function(error) {
        console.error(error);
      });
    })();
  </script>
</body>
</html>
